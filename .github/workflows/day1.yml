name: Day 1 CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display message
        run: echo "Hello! My first GitHub Actions pipeline is running."

      - name: Check runner
        run: |
          echo "Checking the runner environment"
          whoami
          pwd

      - name: List project files
        run: ls -la
      - name: Simulate a failure
        run: exit 1
